[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "releasebot"
version = "0.1.0"
description = "Auto-generate clean changelogs and release notes from your git history (conventional commits)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Bhupendra Gurjar", email = "bgurjar05.bg@gmail.com" }]
keywords = ["changelog", "release-notes", "git", "conventional-commits", "devtools", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
releasebot = "releasebot.cli:main"

[project.urls]
Homepage = "https://github.com/bhupendra05/releasebot"

[tool.pytest.ini_options]
testpaths = ["tests"]
